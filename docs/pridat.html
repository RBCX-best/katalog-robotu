<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přidat Robota - Robotický Kroužek</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        },
                        dark: {
                            bg: '#05070f',
                            card: '#0d1127',
                            border: '#1e293b',
                            input: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark-bg text-slate-100 font-sans min-h-screen relative overflow-x-hidden pb-16">

    <!-- Decorative background glow blobs -->
    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-brand-500/10 blur-[120px] pointer-events-none"></div>
    <div class="absolute top-[20%] right-[-10%] w-[45%] h-[45%] rounded-full bg-blue-500/10 blur-[120px] pointer-events-none"></div>

    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 relative z-10">
        
        <!-- Navigation Link Back -->
        <div class="mb-8 animate-fade-in">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors font-medium">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Zpět do galerie robotů
            </a>
        </div>

        <!-- Header -->
        <header class="mb-12 animate-fade-in">
            <h1 class="font-outfit text-3xl sm:text-5xl font-extrabold bg-gradient-to-r from-white via-slate-100 to-brand-300 bg-clip-text text-transparent mb-4">
                Přidat robota do katalogu
            </h1>
            <p class="text-slate-400 text-base font-light">
                Vyplňte formulář níže. Po kliknutí na tlačítko budete přesměrováni na GitHub Issue, kde pouze nahrajete fotku a potvrdíte odeslání.
            </p>
        </header>

        <!-- Form Panel -->
        <main class="glass-panel p-6 sm:p-10 rounded-3xl border border-slate-800/40 mb-8 animate-fade-in delay-100">
            <form id="robot-form" class="space-y-8">
                
                <!-- Robot Name -->
                <div>
                    <label for="robot-name" class="block text-sm font-semibold text-slate-300 mb-2">
                        Název robota <span class="text-red-400">*</span>
                    </label>
                    <input type="text" id="robot-name" required placeholder="např. Antenka"
                        class="block w-full px-4 py-3 bg-dark-input border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium">
                </div>

                <!-- Year and Competition (Grid) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- School Year -->
                    <div>
                        <label for="robot-year" class="block text-sm font-semibold text-slate-300 mb-2">
                            Rok <span class="text-red-400">*</span>
                        </label>
                        <div class="relative">
                            <select id="robot-year" required
                                class="appearance-none block w-full px-4 py-3 bg-dark-input border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium cursor-pointer">
                                <option value="" disabled selected>Vyberte rok...</option>
                                <option value="custom_year">Jiný rok...</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-500">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </div>
                        </div>
                        <!-- Hidden Custom Year Field -->
                        <div id="custom-year-container" class="mt-3 hidden">
                            <input type="text" id="custom-year-input" placeholder="Zadejte rok (např. 2026)"
                                class="block w-full px-4 py-2.5 bg-dark-input border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium">
                        </div>
                    </div>

                    <!-- Competition -->
                    <div>
                        <label for="robot-competition" class="block text-sm font-semibold text-slate-300 mb-2">
                            Soutěž <span class="text-red-400">*</span>
                        </label>
                        <div class="relative">
                            <select id="robot-competition" required
                                class="appearance-none block w-full px-4 py-3 bg-dark-input border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium cursor-pointer">
                                <option value="" disabled selected>Vyberte soutěž...</option>
                                <option value="custom_competition">Nová soutěž...</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-500">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </div>
                        </div>
                        <!-- Hidden Custom Competition Field -->
                        <div id="custom-competition-container" class="mt-3 hidden">
                            <input type="text" id="custom-competition-input" placeholder="Zadejte název soutěže"
                                class="block w-full px-4 py-2.5 bg-dark-input border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium">
                        </div>
                    </div>
                </div>

                <!-- GitHub Repository -->
                <div>
                    <label for="robot-github" class="block text-sm font-semibold text-slate-300 mb-2">
                        Odkaz na GitHub repozitář robota <span class="text-red-400">*</span>
                    </label>
                    <input type="url" id="robot-github" required placeholder="https://github.com/uzivatel/repozitar"
                        class="block w-full px-4 py-3 bg-dark-input border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium">
                </div>

                <!-- Team Members (Dynamic List) -->
                <div>
                    <label class="block text-sm font-semibold text-slate-355 mb-2">
                        Členové týmu <span class="text-red-400">*</span>
                    </label>
                    
                    <div id="team-members-container" class="space-y-3">
                        <div class="flex gap-2">
                            <input type="text" required placeholder="Jméno a příjmení člena"
                                class="team-member-input block w-full px-4 py-3 bg-dark-input border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium">
                            <button type="button" id="btn-add-member"
                                class="p-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl transition-all flex items-center justify-center min-w-[48px]"
                                title="Přidat dalšího člena">
                                <i data-lucide="plus" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Vývojová deska / platforma (Checkboxes & Custom Tags) -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-3 flex items-center gap-1.5">
                        <i data-lucide="cpu" class="w-4 h-4 text-brand-400"></i>
                        Vývojová deska / platforma
                    </label>
                    
                    <!-- Default Checkboxes Grid -->
                    <div id="board-checkboxes-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-4">
                        <!-- Dynamic checkboxes will be injected by JS -->
                    </div>

                    <!-- Custom Board Tags Container -->
                    <div id="custom-board-tags-container" class="flex flex-wrap gap-2 mb-4">
                        <!-- Custom tags will be dynamically added here -->
                    </div>

                    <!-- Add Custom Board Input -->
                    <div class="flex gap-2 max-w-md">
                        <input type="text" id="custom-board-input" placeholder="Jiná deska/platforma (např. Arduino)..."
                            class="block w-full px-4 py-2.5 bg-dark-input border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium">
                        <button type="button" id="btn-add-custom-board"
                            class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-brand-400 hover:text-brand-300 border border-slate-800 rounded-xl transition-all font-bold flex items-center justify-center gap-1">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            Přidat
                        </button>
                    </div>
                </div>

                <!-- Programovací jazyk (Checkboxes & Custom Tags) -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-3 flex items-center gap-1.5">
                        <i data-lucide="code-2" class="w-4 h-4 text-brand-400"></i>
                        Programovací jazyk
                    </label>
                    
                    <!-- Default Checkboxes Grid -->
                    <div id="language-checkboxes-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-4">
                        <!-- Dynamic checkboxes will be injected by JS -->
                    </div>

                    <!-- Custom Language Tags Container -->
                    <div id="custom-language-tags-container" class="flex flex-wrap gap-2 mb-4">
                        <!-- Custom tags will be dynamically added here -->
                    </div>

                    <!-- Add Custom Language Input -->
                    <div class="flex gap-2 max-w-md">
                        <input type="text" id="custom-language-input" placeholder="Jiný jazyk (např. Rust)..."
                            class="block w-full px-4 py-2.5 bg-dark-input border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium">
                        <button type="button" id="btn-add-custom-language"
                            class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-brand-400 hover:text-brand-300 border border-slate-800 rounded-xl transition-all font-bold flex items-center justify-center gap-1">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            Přidat
                        </button>
                    </div>
                </div>

                <!-- Hardware Tags (Checkboxes & Custom Tags) -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-3">
                        Hardware vybavení (Tagy)
                    </label>
                    
                    <!-- Default Checkboxes Grid -->
                    <div id="hardware-checkboxes-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-4">
                        <!-- Dynamic checkboxes will be injected by JS -->
                    </div>

                    <!-- Custom Tags Container -->
                    <div id="custom-tags-container" class="flex flex-wrap gap-2 mb-4">
                        <!-- Custom tags will be dynamically added here -->
                    </div>

                    <!-- Add Custom Tag Input -->
                    <div class="flex gap-2 max-w-md">
                        <input type="text" id="custom-hardware-input" placeholder="Jiný hardware (např. Teploměr)..."
                            class="block w-full px-4 py-2.5 bg-dark-input border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium">
                        <button type="button" id="btn-add-custom-hardware"
                            class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-brand-400 hover:text-brand-300 border border-slate-800 rounded-xl transition-all font-bold flex items-center justify-center gap-1">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            Přidat
                        </button>
                    </div>
                </div>

                <!-- Submit Section -->
                <div class="pt-6 border-t border-slate-800/40">
                    <button type="submit" 
                        class="w-full py-4 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold rounded-2xl transition-all duration-300 shadow-lg shadow-brand-600/20 flex items-center justify-center gap-2 hover:scale-[1.01]">
                        <i data-lucide="github" class="w-5 h-5"></i>
                        Pokračovat na GitHub
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script>
        // DOM Elements
        const robotForm = document.getElementById('robot-form');
        const robotYear = document.getElementById('robot-year');
        const customYearContainer = document.getElementById('custom-year-container');
        const customYearInput = document.getElementById('custom-year-input');
        
        const robotCompetition = document.getElementById('robot-competition');
        const customCompetitionContainer = document.getElementById('custom-competition-container');
        const customCompetitionInput = document.getElementById('custom-competition-input');
        
        const teamContainer = document.getElementById('team-members-container');
        const btnAddMember = document.getElementById('btn-add-member');

        const customTagsContainer = document.getElementById('custom-tags-container');
        const customHardwareInput = document.getElementById('custom-hardware-input');
        const btnAddCustomHardware = document.getElementById('btn-add-custom-hardware');
        const customTagsList = [];

        const customBoardTagsContainer = document.getElementById('custom-board-tags-container');
        const customBoardInput = document.getElementById('custom-board-input');
        const btnAddCustomBoard = document.getElementById('btn-add-custom-board');
        const customBoardTagsList = [];

        const customLanguageTagsContainer = document.getElementById('custom-language-tags-container');
        const customLanguageInput = document.getElementById('custom-language-input');
        const btnAddCustomLanguage = document.getElementById('btn-add-custom-language');
        const customLanguageTagsList = [];

        // Dynamically toggle custom text inputs
        robotYear.addEventListener('change', () => {
            if (robotYear.value === 'custom_year') {
                customYearContainer.classList.remove('hidden');
                customYearInput.setAttribute('required', 'true');
            } else {
                customYearContainer.classList.add('hidden');
                customYearInput.removeAttribute('required');
            }
        });

        robotCompetition.addEventListener('change', () => {
            if (robotCompetition.value === 'custom_competition') {
                customCompetitionContainer.classList.remove('hidden');
                customCompetitionInput.setAttribute('required', 'true');
            } else {
                customCompetitionContainer.classList.add('hidden');
                customCompetitionInput.removeAttribute('required');
            }
        });

        // Dynamic Team Members List
        btnAddMember.addEventListener('click', () => {
            const memberDiv = document.createElement('div');
            memberDiv.className = 'flex gap-2 animate-fade-in mt-3';
            memberDiv.innerHTML = `
                <input type="text" required placeholder="Jméno a příjmení člena"
                    class="team-member-input block w-full px-4 py-3 bg-dark-input border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/80 transition-all font-medium">
                <button type="button" class="btn-remove-member p-3 bg-slate-900 hover:bg-red-900/40 text-slate-400 hover:text-red-400 border border-slate-800 hover:border-red-900/50 rounded-xl transition-all flex items-center justify-center min-w-[48px]">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
            `;
            teamContainer.appendChild(memberDiv);
            
            // Re-render Lucide icons
            lucide.createIcons();
            
            // Handle removal
            memberDiv.querySelector('.btn-remove-member').addEventListener('click', () => {
                memberDiv.remove();
            });
        });

        // Custom Hardware Tags Management
        function renderCustomTags() {
            customTagsContainer.innerHTML = '';
            customTagsList.forEach((tag, idx) => {
                const tagElement = document.createElement('span');
                tagElement.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 bg-brand-500/10 text-brand-300 border border-brand-500/30 rounded-xl text-xs font-semibold';
                tagElement.innerHTML = `
                    <span>${tag}</span>
                    <button type="button" class="hover:text-red-400 transition-colors" onclick="removeCustomTag(${idx})">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                customTagsContainer.appendChild(tagElement);
            });
            lucide.createIcons();
        }

        window.removeCustomTag = function(idx) {
            customTagsList.splice(idx, 1);
            renderCustomTags();
        };

        btnAddCustomHardware.addEventListener('click', () => {
            const val = customHardwareInput.value.trim();
            if (val) {
                // If tag is already present in custom tags, don't duplicate
                if (customTagsList.some(t => t.toLowerCase() === val.toLowerCase())) {
                    customHardwareInput.value = '';
                    return;
                }
                // Check if it matches a default checkbox
                const defaultCheckboxes = Array.from(document.querySelectorAll('input[name="hardware"]'));
                const matchedCb = defaultCheckboxes.find(cb => cb.value.toLowerCase() === val.toLowerCase());
                if (matchedCb) {
                    matchedCb.checked = true;
                } else {
                    customTagsList.push(val);
                    renderCustomTags();
                }
                customHardwareInput.value = '';
            }
        });

        // Add item on Enter key in custom tag input
        customHardwareInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                btnAddCustomHardware.click();
            }
        });

        // Custom Board Tags Management
        function renderCustomBoardTags() {
            customBoardTagsContainer.innerHTML = '';
            customBoardTagsList.forEach((tag, idx) => {
                const tagElement = document.createElement('span');
                tagElement.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 bg-brand-500/10 text-brand-300 border border-brand-500/30 rounded-xl text-xs font-semibold';
                tagElement.innerHTML = `
                    <span>${tag}</span>
                    <button type="button" class="hover:text-red-400 transition-colors" onclick="removeCustomBoardTag(${idx})">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                customBoardTagsContainer.appendChild(tagElement);
            });
            lucide.createIcons();
        }

        window.removeCustomBoardTag = function(idx) {
            customBoardTagsList.splice(idx, 1);
            renderCustomBoardTags();
        };

        btnAddCustomBoard.addEventListener('click', () => {
            const val = customBoardInput.value.trim();
            if (val) {
                if (customBoardTagsList.some(t => t.toLowerCase() === val.toLowerCase())) {
                    customBoardInput.value = '';
                    return;
                }
                const defaultCheckboxes = Array.from(document.querySelectorAll('input[name="board"]'));
                const matchedCb = defaultCheckboxes.find(cb => cb.value.toLowerCase() === val.toLowerCase());
                if (matchedCb) {
                    matchedCb.checked = true;
                } else {
                    customBoardTagsList.push(val);
                    renderCustomBoardTags();
                }
                customBoardInput.value = '';
            }
        });

        customBoardInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                btnAddCustomBoard.click();
            }
        });

        // Custom Language Tags Management
        function renderCustomLanguageTags() {
            customLanguageTagsContainer.innerHTML = '';
            customLanguageTagsList.forEach((tag, idx) => {
                const tagElement = document.createElement('span');
                tagElement.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 bg-brand-500/10 text-brand-300 border border-brand-500/30 rounded-xl text-xs font-semibold';
                tagElement.innerHTML = `
                    <span>${tag}</span>
                    <button type="button" class="hover:text-red-400 transition-colors" onclick="removeCustomLanguageTag(${idx})">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                customLanguageTagsContainer.appendChild(tagElement);
            });
            lucide.createIcons();
        }

        window.removeCustomLanguageTag = function(idx) {
            customLanguageTagsList.splice(idx, 1);
            renderCustomLanguageTags();
        };

        btnAddCustomLanguage.addEventListener('click', () => {
            const val = customLanguageInput.value.trim();
            if (val) {
                if (customLanguageTagsList.some(t => t.toLowerCase() === val.toLowerCase())) {
                    customLanguageInput.value = '';
                    return;
                }
                const defaultCheckboxes = Array.from(document.querySelectorAll('input[name="language"]'));
                const matchedCb = defaultCheckboxes.find(cb => cb.value.toLowerCase() === val.toLowerCase());
                if (matchedCb) {
                    matchedCb.checked = true;
                } else {
                    customLanguageTagsList.push(val);
                    renderCustomLanguageTags();
                }
                customLanguageInput.value = '';
            }
        });

        customLanguageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                btnAddCustomLanguage.click();
            }
        });

        // Helper to dynamically render a grid of checkboxes
        function renderCheckboxesGrid(containerId, nameAttr, baseTags, dataTags = []) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            
            const allTagsSet = new Set(baseTags);
            dataTags.forEach(tag => {
                const existing = Array.from(allTagsSet).find(t => t.toLowerCase() === tag.toLowerCase());
                if (!existing) {
                    allTagsSet.add(tag);
                }
            });
            
            const sortedTags = Array.from(allTagsSet).sort((a, b) => a.localeCompare(b));
            
            sortedTags.forEach(tag => {
                const label = document.createElement('label');
                label.className = "flex items-center gap-3 p-3.5 bg-dark-input border border-slate-800 hover:border-slate-700/50 rounded-xl cursor-pointer select-none transition-all";
                label.innerHTML = `
                    <input type="checkbox" name="${nameAttr}" value="${tag}" class="w-4 h-4 rounded text-brand-600 bg-slate-900 border-slate-800 focus:ring-brand-500/30">
                    <span class="text-sm font-medium text-slate-350">${tag}</span>
                `;
                container.appendChild(label);
            });
        }

        // Initialize selectors by downloading robots.json
        async function loadExistingFilters() {
            let data = [];
            try {
                const response = await fetch('data/robots.json');
                if (response.ok) {
                    data = await response.json();
                    
                    // Populate years dynamically from 2015 to current calendar year
                    const currentDate = new Date();
                    const currentYear = currentDate.getFullYear();
                    
                    const generatedYears = [];
                    const baseYear = 2015; // base anchor at 2015
                    for (let y = currentYear; y >= baseYear; y--) {
                        generatedYears.push(String(y));
                    }
                    
                    // Also include any other years found in existing JSON data
                    const dataYears = data.map(r => r.year).filter(Boolean);
                    const allYearsSet = new Set([...generatedYears, ...dataYears]);
                    const sortedYears = Array.from(allYearsSet).sort((a, b) => b.localeCompare(a));

                    sortedYears.forEach(year => {
                        const option = document.createElement('option');
                        option.value = year;
                        option.textContent = year;
                        robotYear.insertBefore(option, robotYear.lastElementChild);
                    });

                    // Pre-select the current calendar year
                    robotYear.value = String(currentYear);

                    // Populate competitions
                    const competitions = [...new Set(data.map(r => r.competition).filter(Boolean))].sort((a, b) => a.localeCompare(b));
                    competitions.forEach(comp => {
                        const option = document.createElement('option');
                        option.value = comp;
                        option.textContent = comp;
                        robotCompetition.insertBefore(option, robotCompetition.lastElementChild);
                    });
                }
            } catch (err) {
                console.error("Could not fetch pre-existing filters:", err);
            }

            // Extract unique tags from data
            const dataBoards = [];
            const dataLanguages = [];
            const dataHardware = [];
            
            data.forEach(robot => {
                if (robot.board && Array.isArray(robot.board)) {
                    robot.board.forEach(tag => { if (tag) dataBoards.push(tag.trim()); });
                }
                if (robot.language && Array.isArray(robot.language)) {
                    robot.language.forEach(tag => { if (tag) dataLanguages.push(tag.trim()); });
                }
                if (robot.hardware && Array.isArray(robot.hardware)) {
                    robot.hardware.forEach(tag => { if (tag) dataHardware.push(tag.trim()); });
                }
            });

            // Dynamically render all three checkbox grids
            renderCheckboxesGrid('board-checkboxes-grid', 'board', ["ESP32", "RBCX", "RBC", "Lego Mindstorms", "Robůtek"], dataBoards);
            renderCheckboxesGrid('language-checkboxes-grid', 'language', ["C++", "Python", "Grafické (bloky)"], dataLanguages);
            renderCheckboxesGrid('hardware-checkboxes-grid', 'hardware', ["Kamera", "Barevný senzor", "Lidar", "Ultrazvukový senzor", "Kola", "Pásy"], dataHardware);

            lucide.createIcons();
        }

        // Handle Form Submission -> Create GitHub Issue Redirect
        robotForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // Extract Name
            const name = document.getElementById('robot-name').value.trim();
            
            // Extract Year
            let year = robotYear.value;
            if (year === 'custom_year') {
                year = customYearInput.value.trim();
            }

            // Extract Competition
            let competition = robotCompetition.value;
            if (competition === 'custom_competition') {
                competition = customCompetitionInput.value.trim();
            }

            // Extract GitHub Repo Link
            const github = document.getElementById('robot-github').value.trim();

            // Extract Team Members
            const teamInputs = document.querySelectorAll('.team-member-input');
            const teamMembers = [];
            teamInputs.forEach(input => {
                const val = input.value.trim();
                if (val) teamMembers.push(val);
            });
            const team = teamMembers.join(', ');

            // Extract Board Tags (Default Checked + Custom List)
            const boardCheckboxes = document.querySelectorAll('input[name="board"]:checked');
            const boardTags = [];
            boardCheckboxes.forEach(cb => boardTags.push(cb.value));
            customBoardTagsList.forEach(tag => {
                if (!boardTags.includes(tag)) {
                    boardTags.push(tag);
                }
            });
            const board = boardTags.join(', ') || 'Žádná specifická deska';

            // Extract Language Tags (Default Checked + Custom List)
            const languageCheckboxes = document.querySelectorAll('input[name="language"]:checked');
            const languageTags = [];
            languageCheckboxes.forEach(cb => languageTags.push(cb.value));
            customLanguageTagsList.forEach(tag => {
                if (!languageTags.includes(tag)) {
                    languageTags.push(tag);
                }
            });
            const language = languageTags.join(', ') || 'Žádný specifický jazyk';

            // Extract Hardware Tags (Default Checked + Custom List)
            const hwCheckboxes = document.querySelectorAll('input[name="hardware"]:checked');
            const hwTags = [];
            hwCheckboxes.forEach(cb => hwTags.push(cb.value));
            customTagsList.forEach(tag => {
                if (!hwTags.includes(tag)) {
                    hwTags.push(tag);
                }
            });
            const hardware = hwTags.join(', ') || 'Žádné specifické vybavení';

            // Construct Markdown Body
            const markdownBody = `### Robot Info
- **Název**: ${name}
- **Rok**: ${year}
- **Soutěž**: ${competition}
- **Tým**: ${team}
- **GitHub**: ${github}
- **Vývojová deska**: ${board}
- **Jazyk**: ${language}
- **Hardware**: ${hardware}

### Fotografie
⚠️ **Nezapomeň sem přetáhnout fotku robota (Drag & Drop) do pole níže a pak teprve klikni na Submit!** ⚠️

`;

            // Construct Redirect URL
            const repoUrl = "https://github.com/RBCX-best/katalog-robotu/issues/new";
            const title = `Nový robot: ${name}`;
            const redirectUrl = `${repoUrl}?title=${encodeURIComponent(title)}&body=${encodeURIComponent(markdownBody)}`;

            // Redirect to GitHub
            window.location.href = redirectUrl;
        });

        // Load filters on page load
        document.addEventListener('DOMContentLoaded', loadExistingFilters);
    </script>
</body>
</html>
