<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Síň slávy - Katalog Robotů</title>
    <meta name="description" content="Přehled úspěchů a ocenění našich robotů na soutěžích. Síň slávy robotického kroužku.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        },
                        dark: {
                            bg: '#05070f',
                            card: '#0d1127',
                            border: '#1e293b',
                            input: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS for advanced styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Lucide Icons for premium feel -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark-bg text-slate-100 font-sans min-h-screen relative overflow-x-hidden selection:bg-brand-500 selection:text-white pb-16">

    <!-- Decorative background glow blobs -->
    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-brand-500/10 blur-[120px] pointer-events-none"></div>
    <div class="absolute top-[20%] right-[-10%] w-[45%] h-[45%] rounded-full bg-blue-500/10 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] left-[20%] w-[50%] h-[50%] rounded-full bg-indigo-500/10 blur-[120px] pointer-events-none"></div>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 relative z-10">
        
        <!-- Top Bar Navigation -->
        <div class="flex justify-between items-center mb-12 animate-fade-in relative z-20">
            <!-- Brand Logo/Title -->
            <a href="index.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
                <i data-lucide="bot" class="w-5 h-5 text-brand-400"></i>
                <span class="font-outfit font-bold text-white text-xs sm:text-sm tracking-wider uppercase">Katalog Robotů</span>
            </a>
            
            <!-- Actions -->
            <div class="flex items-center gap-2 sm:gap-2.5">
                <a href="index.html" class="inline-flex items-center gap-2 px-3 sm:px-4 py-2 bg-slate-900/60 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 text-xs font-semibold rounded-xl transition-all shadow-lg">
                    <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                    <span>Katalog</span>
                </a>
                <a href="pridat.html" class="inline-flex items-center gap-1.5 px-3 sm:px-4 py-2 bg-brand-600/10 hover:bg-brand-600/20 border border-brand-500/35 text-brand-300 hover:text-white text-xs font-bold rounded-xl transition-all shadow-lg shadow-brand-500/5">
                    <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                    Přidat robota
                </a>
            </div>
        </div>

        <!-- Header -->
        <header class="text-center mb-16 animate-fade-in">
            <div class="inline-flex items-center justify-center p-3 bg-amber-500/10 border border-amber-500/25 rounded-2xl mb-4 shadow-lg shadow-amber-500/5">
                <i data-lucide="trophy" class="w-8 h-8 text-amber-400"></i>
            </div>
            <h1 class="font-outfit text-4xl sm:text-6xl font-extrabold bg-gradient-to-r from-white via-slate-100 to-amber-300 bg-clip-text text-transparent mb-4">
                Síň slávy & Úspěchy
            </h1>
            <p class="text-slate-400 text-base sm:text-lg max-w-2xl mx-auto font-light leading-relaxed font-outfit">
                Přehled ocenění a pódiových umístění, která naši roboti vybojovali na soutěžích.
            </p>
        </header>

        <!-- Stats Overview Panel -->
        <div id="stats-panel" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 animate-fade-in delay-100">
            <!-- Dynamically populated stats cards -->
        </div>

        <!-- Search and Filters Panel -->
        <div class="glass-panel p-6 rounded-2xl border border-slate-800/40 mb-12 animate-fade-in delay-150">
            <div class="flex flex-col md:flex-row gap-4">
                <!-- Search bar -->
                <div class="flex-grow relative">
                    <i data-lucide="search" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                    <input type="text" id="search-achievements" placeholder="Hledat podle jména robota, týmu nebo soutěže..."
                        class="w-full pl-11 pr-4 py-2.5 bg-dark-input border border-slate-800 rounded-xl text-slate-200 placeholder-slate-650 focus:outline-none focus:ring-2 focus:ring-brand-500/50 transition-all font-medium text-sm">
                </div>
                <!-- Medal Filter -->
                <div class="flex gap-2 flex-wrap">
                    <button class="filter-medal-btn px-4 py-2 bg-brand-600 text-white text-xs font-bold rounded-xl border border-brand-500/35 transition-all shadow-md" data-medal="all">Všechny</button>
                    <button class="filter-medal-btn px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-semibold rounded-xl border border-slate-800 transition-all" data-medal="gold">🥇 Zlato</button>
                    <button class="filter-medal-btn px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-semibold rounded-xl border border-slate-800 transition-all" data-medal="silver">🥈 Stříbro</button>
                    <button class="filter-medal-btn px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-semibold rounded-xl border border-slate-800 transition-all" data-medal="bronze">🥉 Bronz</button>
                </div>
            </div>
            <!-- Year Quick Links -->
            <div id="year-filters-container" class="flex gap-1.5 flex-wrap mt-4 pt-3 border-t border-slate-800/50">
                <!-- Dynamically populated year pills -->
            </div>
        </div>

        <!-- Timeline Section -->
        <div class="relative animate-fade-in delay-200">
            <!-- Timeline Center Line -->
            <div class="absolute left-4 md:left-1/2 transform md:-translate-x-1/2 top-2 bottom-2 w-0.5 bg-gradient-to-b from-brand-500 via-indigo-500 to-slate-800"></div>

            <!-- Timeline Items Container -->
            <div id="timeline-container" class="space-y-12">
                <!-- Dynamically populated timeline nodes -->
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-20 bg-dark-card/30 border border-slate-800/40 rounded-3xl backdrop-blur-md animate-fade-in">
            <div class="inline-flex items-center justify-center p-4 bg-slate-900 border border-slate-800 rounded-2xl mb-4 text-slate-500">
                <i data-lucide="award" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-300 mb-1">Zatím žádné úspěchy</h3>
            <p class="text-slate-500 text-sm max-w-sm mx-auto">
                Nepodařilo se najít žádné úspěchy odpovídající zvoleným filtrům.
            </p>
        </div>

    </div>

    <script>
        const timelineContainer = document.getElementById('timeline-container');
        const statsPanel = document.getElementById('stats-panel');
        const emptyState = document.getElementById('empty-state');

        let allAchievements = [];
        let currentMedalFilter = 'all';
        let currentYearFilter = 'all';
        let searchQuery = '';

        // Helper to prioritize placements
        function getPlacementPriority(placement) {
            if (!placement) return 99;
            const clean = placement.toString().toLowerCase();
            if (clean.includes('1.')) return 1;
            if (clean.includes('2.')) return 2;
            if (clean.includes('3.')) return 3;
            return 4;
        }

        // Fetch robots data and filter/render achievements
        async function fetchAndRenderAchievements() {
            try {
                const response = await fetch('data/robots.json');
                if (!response.ok) throw new Error("Could not load data");
                const robots = await response.json();

                // Filter robots with achievements (placement exists and is not default empty string)
                allAchievements = robots.filter(robot => {
                    return robot.placement && 
                           robot.placement !== 'Bez specifického umístění' && 
                           robot.placement !== 'Bez umístění';
                });

                if (allAchievements.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                // Render overall stats
                renderStats(allAchievements);

                // Build year filter pills
                renderYearFilters(allAchievements);

                // Render achievements
                filterAndRender();

            } catch (err) {
                console.error("Could not render timeline:", err);
                emptyState.classList.remove('hidden');
            }
        }

        function renderStats(data) {
            let goldCount = 0;
            let silverCount = 0;
            let bronzeCount = 0;

            data.forEach(robot => {
                if (robot.placement.includes('1.')) goldCount++;
                else if (robot.placement.includes('2.')) silverCount++;
                else if (robot.placement.includes('3.')) bronzeCount++;
            });

            statsPanel.innerHTML = `
                <div class="glass-panel p-5 rounded-2xl border border-slate-800/40 flex flex-col items-center justify-center text-center">
                    <span class="text-2xl mb-1">🥇</span>
                    <div class="text-2xl font-bold font-outfit text-amber-400">${goldCount}x</div>
                    <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider mt-1">Zlatá medaile</div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800/40 flex flex-col items-center justify-center text-center">
                    <span class="text-2xl mb-1">🥈</span>
                    <div class="text-2xl font-bold font-outfit text-slate-300">${silverCount}x</div>
                    <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider mt-1">Stříbrná medaile</div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800/40 flex flex-col items-center justify-center text-center">
                    <span class="text-2xl mb-1">🥉</span>
                    <div class="text-2xl font-bold font-outfit text-amber-600">${bronzeCount}x</div>
                    <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider mt-1">Bronzová medaile</div>
                </div>
                <div class="glass-panel p-5 rounded-2xl border border-slate-800/40 flex flex-col items-center justify-center text-center">
                    <span class="text-2xl mb-1">🏆</span>
                    <div class="text-2xl font-bold font-outfit text-brand-300">${data.length}x</div>
                    <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider mt-1">Ocenění celkem</div>
                </div>
            `;
        }

        function renderYearFilters(data) {
            const yearsSet = new Set();
            data.forEach(robot => {
                if (robot.year) yearsSet.add(robot.year.toString());
            });
            const sortedYears = Array.from(yearsSet).sort((a, b) => parseInt(b) - parseInt(a));
            
            const container = document.getElementById('year-filters-container');
            let pillsHtml = `
                <button class="filter-year-btn px-3 py-1.5 bg-brand-600 text-white text-[11px] font-bold rounded-lg border border-brand-500/35 transition-all shadow-md" data-year="all">Všechny roky</button>
            `;
            sortedYears.forEach(yr => {
                pillsHtml += `
                    <button class="filter-year-btn px-3 py-1.5 bg-slate-900/60 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 text-[11px] font-semibold rounded-lg transition-all" data-year="${yr}">${yr}</button>
                `;
            });
            container.innerHTML = pillsHtml;

            // Attach event listeners
            document.querySelectorAll('.filter-year-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-year-btn').forEach(b => {
                        b.className = "filter-year-btn px-3 py-1.5 bg-slate-900/60 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 text-[11px] font-semibold rounded-lg transition-all";
                    });
                    btn.className = "filter-year-btn px-3 py-1.5 bg-brand-600 text-white text-[11px] font-bold rounded-lg border border-brand-500/35 transition-all shadow-md";
                    currentYearFilter = btn.getAttribute('data-year');
                    filterAndRender();
                });
            });
        }

        function filterAndRender() {
            let filtered = [...allAchievements];

            // Filter search query
            if (searchQuery.trim() !== '') {
                const query = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(robot => {
                    return (robot.name && robot.name.toLowerCase().includes(query)) ||
                           (robot.team && robot.team.toLowerCase().includes(query)) ||
                           (robot.competition && robot.competition.toLowerCase().includes(query));
                });
            }

            // Filter medals
            if (currentMedalFilter !== 'all') {
                filtered = filtered.filter(robot => {
                    if (currentMedalFilter === 'gold') return robot.placement.includes('1.');
                    if (currentMedalFilter === 'silver') return robot.placement.includes('2.');
                    if (currentMedalFilter === 'bronze') return robot.placement.includes('3.');
                    return false;
                });
            }

            // Filter years
            if (currentYearFilter !== 'all') {
                filtered = filtered.filter(robot => robot.year.toString() === currentYearFilter);
            }

            if (filtered.length === 0) {
                timelineContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Group by Year and then by Competition
            const grouped = {};
            filtered.forEach(robot => {
                const yr = robot.year.toString();
                const comp = robot.competition || 'Ostatní soutěže';
                if (!grouped[yr]) grouped[yr] = {};
                if (!grouped[yr][comp]) grouped[yr][comp] = [];
                grouped[yr][comp].push(robot);
            });

            // Sort achievements inside each group
            for (const yr in grouped) {
                for (const comp in grouped[yr]) {
                    grouped[yr][comp].sort((a, b) => {
                        return getPlacementPriority(a.placement) - getPlacementPriority(b.placement);
                    });
                }
            }

            // Render Timeline
            timelineContainer.innerHTML = '';
            const sortedYears = Object.keys(grouped).sort((a, b) => parseInt(b) - parseInt(a));

            sortedYears.forEach((yr, index) => {
                const item = document.createElement('div');
                const isRight = index % 2 === 0;
                item.className = `relative flex flex-col md:flex-row items-start md:items-center ${isRight ? 'md:flex-row-reverse' : ''} w-full`;

                // Calculate year medals
                let yrGold = 0, yrSilver = 0, yrBronze = 0;
                for (const comp in grouped[yr]) {
                    grouped[yr][comp].forEach(robot => {
                        if (robot.placement.includes('1.')) yrGold++;
                        else if (robot.placement.includes('2.')) yrSilver++;
                        else if (robot.placement.includes('3.')) yrBronze++;
                    });
                }

                // Render competitions within the year card
                let competitionsHtml = '';
                const sortedComps = Object.keys(grouped[yr]).sort();

                sortedComps.forEach(comp => {
                    const robotsInComp = grouped[yr][comp];
                    let robotRowsHtml = '';

                    robotsInComp.forEach(robot => {
                        let medalBadge = '🏆';
                        let badgeColor = 'from-brand-500/20 to-indigo-650/10 border-brand-500/30 text-brand-300';
                        
                        if (robot.placement.includes('1.')) {
                            medalBadge = '🥇';
                            badgeColor = 'from-amber-400/20 to-yellow-500/10 border-amber-500/30 text-amber-300';
                        } else if (robot.placement.includes('2.')) {
                            medalBadge = '🥈';
                            badgeColor = 'from-slate-300/20 to-slate-450/10 border-slate-400/30 text-slate-200';
                        } else if (robot.placement.includes('3.')) {
                            medalBadge = '🥉';
                            badgeColor = 'from-amber-700/20 to-amber-850/10 border-amber-700/30 text-amber-600';
                        }

                        robotRowsHtml += `
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-3 bg-slate-900/60 hover:bg-slate-900/90 border border-slate-800/40 hover:border-brand-500/30 rounded-xl transition-all duration-300 group relative">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 rounded-lg overflow-hidden bg-slate-950 flex-shrink-0 relative border border-slate-850">
                                        <img src="${robot.image}" alt="${robot.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.onerror=null; this.src='https://placehold.co/80x80/0d1127/a78bfa?text=${encodeURIComponent(robot.name)}';">
                                    </div>
                                    <div>
                                        <div class="flex flex-wrap items-center gap-2 mb-1">
                                            <span class="font-outfit font-bold text-white text-sm group-hover:text-brand-300 transition-colors">${robot.name}</span>
                                            <div class="flex items-center gap-1 px-2 py-0.5 rounded-md border ${badgeColor} text-[9px] font-extrabold uppercase tracking-wide">
                                                <span>${medalBadge}</span>
                                                <span>${robot.placement}</span>
                                            </div>
                                        </div>
                                        <p class="text-[11px] text-slate-400 font-light"><span class="text-slate-500 font-medium font-sans">Tým:</span> ${robot.team}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 self-end sm:self-center">
                                    <a href="index.html?search=${encodeURIComponent(robot.name)}" class="px-2.5 py-1.5 bg-slate-950 hover:bg-brand-600 border border-slate-800 hover:border-brand-500/40 text-slate-350 hover:text-white text-[11px] font-bold rounded-lg transition-all flex items-center gap-1">
                                        <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        Detail
                                    </a>
                                    ${robot.github ? `
                                    <a href="${robot.github}" target="_blank" class="p-1.5 bg-slate-950 hover:bg-slate-850 border border-slate-800 text-slate-400 hover:text-white rounded-lg transition-all" title="GitHub Repozitář">
                                        <i data-lucide="github" class="w-3.5 h-3.5"></i>
                                    </a>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    });

                    competitionsHtml += `
                        <div class="bg-slate-950/40 border border-slate-800/80 rounded-xl p-4">
                            <div class="flex items-center justify-between cursor-pointer select-none" onclick="toggleCompetition(this)">
                                <h4 class="font-outfit text-sm font-bold text-slate-200 flex items-center gap-2 group">
                                    <i data-lucide="award" class="w-4 h-4 text-blue-400 group-hover:scale-110 transition-transform"></i>
                                    <span>${comp}</span>
                                </h4>
                                <div class="flex items-center gap-2 text-[11px] text-slate-500 font-semibold font-outfit">
                                    <span>${robotsInComp.length}x úspěch</span>
                                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 transition-transform duration-300"></i>
                                </div>
                            </div>
                            <div class="competition-rows space-y-2 mt-3 transition-all duration-300 overflow-hidden">
                                ${robotRowsHtml}
                            </div>
                        </div>
                    `;
                });

                // Year summary badges
                let yearBadgesHtml = '';
                if (yrGold > 0) yearBadgesHtml += `<span class="px-2 py-0.5 bg-amber-500/10 text-amber-300 border border-amber-500/20 rounded-md text-[10px] font-bold">🥇 ${yrGold}x</span>`;
                if (yrSilver > 0) yearBadgesHtml += `<span class="px-2 py-0.5 bg-slate-350/10 text-slate-300 border border-slate-350/20 rounded-md text-[10px] font-bold">🥈 ${yrSilver}x</span>`;
                if (yrBronze > 0) yearBadgesHtml += `<span class="px-2 py-0.5 bg-amber-700/10 text-amber-600 border border-amber-700/20 rounded-md text-[10px] font-bold">🥉 ${yrBronze}x</span>`;

                item.innerHTML = `
                    <!-- Timeline Point Node -->
                    <div class="absolute left-4 md:left-1/2 transform -translate-x-1/2 z-10 w-9 h-9 rounded-full bg-slate-900 border-2 border-brand-500 flex items-center justify-center shadow-lg shadow-brand-500/25">
                        <span class="text-sm font-bold font-outfit text-brand-400">${yr.slice(-2)}</span>
                    </div>

                    <!-- Spacer for desktop layout -->
                    <div class="hidden md:block w-1/2"></div>

                    <!-- Card Content Block -->
                    <div class="pl-12 md:pl-0 w-full md:w-[calc(50%-2rem)] animate-fade-in" style="animation-delay: ${index * 100}ms">
                        <div class="glass-panel p-5 rounded-2xl border border-slate-800/40 flex flex-col gap-4 relative overflow-hidden">
                            <!-- Year Header -->
                            <div class="flex items-center justify-between pb-3 border-b border-slate-800/40">
                                <h3 class="font-outfit text-2xl font-extrabold text-white flex items-center gap-2">
                                    <i data-lucide="calendar" class="w-5.5 h-5.5 text-brand-400"></i>
                                    Rok ${yr}
                                </h3>
                                <div class="flex items-center gap-1.5">
                                    ${yearBadgesHtml}
                                </div>
                            </div>

                            <!-- Competitions Group -->
                            <div class="space-y-4">
                                ${competitionsHtml}
                            </div>
                        </div>
                    </div>
                `;
                timelineContainer.appendChild(item);
            });

            lucide.createIcons();
        }

        // Global function to toggle competition details
        window.toggleCompetition = function(headerEl) {
            const container = headerEl.nextElementSibling;
            const chevron = headerEl.querySelector('.lucide-chevron-down');
            
            if (container.classList.contains('collapsed')) {
                container.classList.remove('collapsed');
                if (chevron) chevron.style.transform = 'rotate(0deg)';
            } else {
                container.classList.add('collapsed');
                if (chevron) chevron.style.transform = 'rotate(-90deg)';
            }
        };

        // Attach static event listeners
        document.getElementById('search-achievements').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            filterAndRender();
        });

        document.querySelectorAll('.filter-medal-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-medal-btn').forEach(b => {
                    b.className = "filter-medal-btn px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-semibold rounded-xl border border-slate-800 transition-all";
                });
                btn.className = "filter-medal-btn px-4 py-2 bg-brand-600 text-white text-xs font-bold rounded-xl border border-brand-500/35 transition-all shadow-md";
                currentMedalFilter = btn.getAttribute('data-medal');
                filterAndRender();
            });
        });

        document.addEventListener('DOMContentLoaded', fetchAndRenderAchievements);
    </script>
</body>
</html>
