<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Síň slávy - Katalog Robotů</title>
    <meta name="description" content="Přehled úspěchů a ocenění našich robotů na soutěžích. Síň slávy robotického kroužku.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        },
                        dark: {
                            bg: '#05070f',
                            card: '#0d1127',
                            border: '#1e293b',
                            input: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS for advanced styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Lucide Icons for premium feel -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark-bg text-slate-100 font-sans min-h-screen relative overflow-x-hidden selection:bg-brand-500 selection:text-white pb-16">

    <!-- Decorative background glow blobs -->
    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-brand-500/10 blur-[120px] pointer-events-none"></div>
    <div class="absolute top-[20%] right-[-10%] w-[45%] h-[45%] rounded-full bg-blue-500/10 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] left-[20%] w-[50%] h-[50%] rounded-full bg-indigo-500/10 blur-[120px] pointer-events-none"></div>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 relative z-10">
        
        <!-- Top Bar Navigation -->
        <div class="flex justify-between items-center mb-12 animate-fade-in relative z-20">
            <!-- Brand Logo/Title -->
            <a href="index.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
                <i data-lucide="bot" class="w-5 h-5 text-brand-400"></i>
                <span class="font-outfit font-bold text-white text-xs sm:text-sm tracking-wider uppercase">Katalog Robotů</span>
            </a>
            
            <!-- Actions -->
            <div class="flex items-center gap-2 sm:gap-2.5">
                <a href="index.html" class="inline-flex items-center gap-2 px-3 sm:px-4 py-2 bg-slate-900/60 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 text-xs font-semibold rounded-xl transition-all shadow-lg">
                    <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                    <span>Katalog</span>
                </a>
                <a href="pridat.html" class="inline-flex items-center gap-1.5 px-3 sm:px-4 py-2 bg-brand-600/10 hover:bg-brand-600/20 border border-brand-500/35 text-brand-300 hover:text-white text-xs font-bold rounded-xl transition-all shadow-lg shadow-brand-500/5">
                    <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                    Přidat robota
                </a>
            </div>
        </div>

        <!-- Header -->
        <header class="text-center mb-16 animate-fade-in">
            <div class="inline-flex items-center justify-center p-3 bg-amber-500/10 border border-amber-500/25 rounded-2xl mb-4 shadow-lg shadow-amber-500/5">
                <i data-lucide="trophy" class="w-8 h-8 text-amber-400"></i>
            </div>
            <h1 class="font-outfit text-4xl sm:text-6xl font-extrabold bg-gradient-to-r from-white via-slate-100 to-amber-300 bg-clip-text text-transparent mb-4">
                Síň slávy & Úspěchy
            </h1>
            <p class="text-slate-400 text-base sm:text-lg max-w-2xl mx-auto font-light leading-relaxed font-outfit">
                Přehled ocenění a pódiových umístění, která naši roboti vybojovali na soutěžích.
            </p>
        </header>

        <!-- Stats Overview Panel -->
        <div id="stats-panel" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-16 animate-fade-in delay-100">
            <!-- Dynamically populated stats cards -->
        </div>

        <!-- Timeline Section -->
        <div class="relative animate-fade-in delay-200">
            <!-- Timeline Center Line -->
            <div class="absolute left-4 md:left-1/2 transform md:-translate-x-1/2 top-2 bottom-2 w-0.5 bg-gradient-to-b from-brand-500 via-indigo-500 to-slate-800"></div>

            <!-- Timeline Items Container -->
            <div id="timeline-container" class="space-y-12">
                <!-- Dynamically populated timeline nodes -->
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-20 bg-dark-card/30 border border-slate-800/40 rounded-3xl backdrop-blur-md animate-fade-in">
            <div class="inline-flex items-center justify-center p-4 bg-slate-900 border border-slate-800 rounded-2xl mb-4 text-slate-500">
                <i data-lucide="award" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-300 mb-1">Zatím žádné úspěchy</h3>
            <p class="text-slate-500 text-sm max-w-sm mx-auto">
                Jakmile u některého z robotů v katalogu vyplníte jeho umístění, zobrazí se zde v časové ose.
            </p>
        </div>

    </div>

    <script>
        const timelineContainer = document.getElementById('timeline-container');
        const statsPanel = document.getElementById('stats-panel');
        const emptyState = document.getElementById('empty-state');

        // Fetch robots data and filter/render achievements
        async function fetchAndRenderAchievements() {
            try {
                const response = await fetch('data/robots.json');
                if (!response.ok) throw new Error("Could not load data");
                const robots = await response.json();

                // Filter robots with achievements (placement exists and is not default empty string)
                const achievements = robots.filter(robot => {
                    return robot.placement && 
                           robot.placement !== 'Bez specifického umístění' && 
                           robot.placement !== 'Bez umístění';
                });

                if (achievements.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                // Count stats
                let goldCount = 0;
                let silverCount = 0;
                let bronzeCount = 0;
                let otherCount = 0;

                achievements.forEach(robot => {
                    if (robot.placement.includes('1.')) goldCount++;
                    else if (robot.placement.includes('2.')) silverCount++;
                    else if (robot.placement.includes('3.')) bronzeCount++;
                    else otherCount++;
                });

                // Render stats panel
                statsPanel.innerHTML = `
                    <div class="glass-panel p-5 rounded-2xl border border-slate-800/40 flex flex-col items-center justify-center text-center">
                        <span class="text-2xl mb-1">🥇</span>
                        <div class="text-2xl font-bold font-outfit text-amber-400">${goldCount}x</div>
                        <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider mt-1">Zlatá medaile</div>
                    </div>
                    <div class="glass-panel p-5 rounded-2xl border border-slate-800/40 flex flex-col items-center justify-center text-center">
                        <span class="text-2xl mb-1">🥈</span>
                        <div class="text-2xl font-bold font-outfit text-slate-300">${silverCount}x</div>
                        <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider mt-1">Stříbrná medaile</div>
                    </div>
                    <div class="glass-panel p-5 rounded-2xl border border-slate-800/40 flex flex-col items-center justify-center text-center">
                        <span class="text-2xl mb-1">🥉</span>
                        <div class="text-2xl font-bold font-outfit text-amber-600">${bronzeCount}x</div>
                        <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider mt-1">Bronzová medaile</div>
                    </div>
                    <div class="glass-panel p-5 rounded-2xl border border-slate-800/40 flex flex-col items-center justify-center text-center">
                        <span class="text-2xl mb-1">🏆</span>
                        <div class="text-2xl font-bold font-outfit text-brand-300">${achievements.length}x</div>
                        <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider mt-1">Ocenění celkem</div>
                    </div>
                `;

                // Sort by year (descending)
                achievements.sort((a, b) => {
                    const yearA = parseInt(a.year) || 0;
                    const yearB = parseInt(b.year) || 0;
                    return yearB - yearA;
                });

                // Render timeline items
                timelineContainer.innerHTML = '';
                achievements.forEach((robot, index) => {
                    const item = document.createElement('div');
                    // Alternating sides on desktop
                    const isRight = index % 2 === 0;
                    
                    item.className = `relative flex flex-col md:flex-row items-start md:items-center ${isRight ? 'md:flex-row-reverse' : ''} w-full`;

                    // Placement Badge
                    let medalBadge = '🥇';
                    let badgeColor = 'from-amber-400 to-yellow-500';
                    let medalLabel = robot.placement;
                    
                    if (robot.placement.includes('1.')) {
                        medalBadge = '🥇';
                        badgeColor = 'from-amber-400/20 to-yellow-500/10 border-amber-500/30 text-amber-300';
                    } else if (robot.placement.includes('2.')) {
                        medalBadge = '🥈';
                        badgeColor = 'from-slate-300/20 to-slate-400/10 border-slate-400/30 text-slate-200';
                    } else if (robot.placement.includes('3.')) {
                        medalBadge = '🥉';
                        badgeColor = 'from-amber-700/20 to-amber-800/10 border-amber-700/30 text-amber-600';
                    } else {
                        medalBadge = '🏆';
                        badgeColor = 'from-brand-500/20 to-indigo-600/10 border-brand-500/30 text-brand-300';
                    }

                    // Card contents
                    item.innerHTML = `
                        <!-- Timeline Point Node -->
                        <div class="absolute left-4 md:left-1/2 transform -translate-x-1/2 z-10 w-9 h-9 rounded-full bg-slate-900 border-2 border-brand-500 flex items-center justify-center shadow-lg shadow-brand-500/25">
                            <span class="text-sm font-bold font-outfit text-brand-400">${robot.year.toString().slice(-2)}</span>
                        </div>

                        <!-- Spacer for desktop layout -->
                        <div class="hidden md:block w-1/2"></div>

                        <!-- Card Content Block -->
                        <div class="pl-12 md:pl-0 w-full md:w-[calc(50%-2rem)] animate-fade-in" style="animation-delay: ${index * 100}ms">
                            <a href="index.html?search=${encodeURIComponent(robot.name)}" class="glass-card p-6 rounded-2xl border border-slate-800/40 hover:border-brand-500/30 hover:scale-[1.01] transition-all duration-300 flex flex-col sm:flex-row gap-5 group relative overflow-hidden block cursor-pointer">
                                <!-- Image Preview -->
                                <div class="w-full sm:w-28 h-28 rounded-xl overflow-hidden bg-slate-950 flex-shrink-0 relative">
                                    <img src="${robot.image}" alt="${robot.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.onerror=null; this.src='https://placehold.co/150x150/0d1127/a78bfa?text=${encodeURIComponent(robot.name)}';">
                                </div>

                                <!-- Description -->
                                <div class="flex-grow flex flex-col">
                                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                                        <div class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg border bg-gradient-to-r ${badgeColor} text-[10px] font-bold tracking-wide uppercase">
                                            <span class="text-xs">${medalBadge}</span>
                                            <span>${medalLabel}</span>
                                        </div>
                                        <span class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold font-outfit">${robot.year}</span>
                                    </div>

                                    <h3 class="font-outfit text-xl font-extrabold text-white group-hover:text-brand-300 transition-colors mb-1">
                                        ${robot.name}
                                    </h3>

                                    <div class="flex items-center gap-1 text-slate-400 text-xs font-semibold mb-2">
                                        <i data-lucide="trophy" class="w-3.5 h-3.5 text-blue-400"></i>
                                        <span>${robot.competition}</span>
                                    </div>

                                    <p class="text-slate-400 text-xs leading-relaxed mt-auto">
                                        <span class="text-slate-500 font-semibold font-sans">Tým:</span> ${robot.team}
                                    </p>

                                    <!-- Link to Repository -->
                                    <span class="absolute bottom-4 right-4 text-slate-500 hover:text-white transition-colors z-20" onclick="event.preventDefault(); event.stopPropagation(); window.open('${robot.github}', '_blank')">
                                        <i data-lucide="github" class="w-5 h-5"></i>
                                    </span>
                                </div>
                            </a>
                        </div>
                    `;
                    timelineContainer.appendChild(item);
                });

                lucide.createIcons();

            } catch (err) {
                console.error("Could not render timeline:", err);
                emptyState.classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchAndRenderAchievements);
    </script>
</body>
</html>
